# XcodeGen spec. Run `xcodegen generate` to produce Wisq.xcodeproj.
# The project file is not checked in: it is generated, and merge conflicts in a
# .pbxproj cost more than the tool does.
name: Wisq
options:
  bundleIdPrefix: app.wisq
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Wisq:
    path: .

targets:
  Wisq:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
    dependencies:
      - package: Wisq
        product: WisqUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wisq.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
