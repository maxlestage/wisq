# XcodeGen spec. Run `xcodegen generate` to produce Wisq.xcodeproj.
# The project file is not checked in: it is generated, and merge conflicts in a
# .pbxproj cost more than the tool does.
name: Wisq
options:
  bundleIdPrefix: app.wisq
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Wisq:
    path: .

targets:
  Wisq:
    type: application
    platform: iOS
    sources:
      - path: App
    # `xcodegen generate` ÉCRIT ce fichier : il prend ses clés par défaut,
    # y fusionne `properties`, supprime ce qui existait et écrit le résultat.
    # Un `App/Info.plist` écrit à la main était donc effacé à chaque
    # génération, et l'application construite n'avait que huit clés — mesuré
    # en exécutant XcodeGen (FileWriter.writePlists → InfoPlistGenerator).
    # Tout ce qui compte vit donc ici, où l'outil le conserve.
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: fr
        CFBundleDisplayName: wisq
        NSHumanReadableCopyright: >-
          Designed and developed by Maxime Nathan Lestage.
          Copyright 2026 Maxime Nathan Lestage. All rights reserved.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sans écran de lancement, App Store Connect refuse le paquet :
        # « Apps that support Multitasking on iPad must provide the app's
        # launch screen » (erreur 90475). Le dictionnaire vide demande
        # l'écran système, ce que wisq veut : rien à montrer avant la liste.
        UILaunchScreen: {}
        # Et sans orientations, erreur 90474. wisq refuse le portrait inversé :
        # un téléphone retourné pendant qu'on tient une session distante fait
        # sauter l'écran sans que personne l'ait demandé.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        # Déclaré une fois ici plutôt qu'à chaque envoi dans le formulaire de
        # conformité à l'exportation.
        ITSAppUsesNonExemptEncryption: false
        # iOS 14 et suivants refusent le réseau local sans cette phrase — donc
        # sans elle, aucune machine du réseau n'est joignable, ce qui est tout
        # ce que fait wisq.
        NSLocalNetworkUsageDescription: >-
          wisq se connecte aux machines de votre réseau local pour afficher
          leur écran.
        # Le lien d'appairage que le démon imprime et que le QR encode.
        CFBundleURLTypes:
          - CFBundleURLName: app.wisq.pairing
            CFBundleURLSchemes:
              - wisq
        # La découverte des agents et des serveurs VNC sur le réseau local.
        NSBonjourServices:
          - _rfb._tcp
          - _wisq-agent._tcp
    dependencies:
      - package: Wisq
        product: WisqUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wisq.ios
        # Le catalogue est écrit par `scripts/build-app-icon.sh` avant
        # `xcodegen`, jamais commité : l'icône est la marque du site, dessinée
        # par le même code. Sans elle, l'application se construit et se lance,
        # et c'est l'envoi à Apple qui la refuse — un rouge qui n'arrive qu'au
        # dernier moment.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - WisqUITests

  # The app layer used to be the part nothing checked: `WisqUI` is `#if
  # os(iOS)`, so the Linux runner never compiles it, let alone runs it. It
  # needs an iOS runtime — and CI has one, so this bundle runs in a booted
  # simulator against the real interpreter instead of the layer being written
  # off as untestable. Two defects reached a pull request while it was.
  #
  # No host application: these are unit tests over `WisqUI`, and hosting them
  # in the app would mean a launch, a window, and a scene phase the test does
  # not control.
  WisqUITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/WisqUITests
    dependencies:
      - package: Wisq
        product: WisqUI
      # Explicit rather than transitive: the tests restore a saved machine into
      # a fresh interpreter to check it is really there, which needs the core
      # by name.
      - package: Wisq
        product: WisqVM
      # Likewise for the model: reading a connection file rests on what
      # Foundation does with a byte order mark, and Foundation on Darwin is not
      # the same implementation as Foundation on Linux. That claim is checked
      # here, on the platform that ships, rather than inferred from the Linux
      # job.
      - package: Wisq
        product: WisqCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
