# Rust side of wisq: the parts that are pure computation or a plain daemon, and
# therefore have no reason to be tied to a platform runtime.
#
#   crates/wisq-vm     the rv32ima interpreter — a static library for the iPhone
#                      app, and the benchmark that measures it
#   crates/wisq-agent  the host daemon for Mac and Linux
#   crates/wisq-site   the site's front end, written with Active: views
#                      pre-rendered at build time, islands hydrated and the
#                      motion run in WebAssembly, and the rv32ima machine
#                      booting Linux in the browser
#
# The Swift package keeps what is genuinely Apple-shaped: the UI, and the remote
# desktop client built on Network.framework.
[workspace]
resolver = "2"
members = ["crates/wisq-vm", "crates/wisq-agent", "crates/wisq-site"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Le wasm du site se construit sous son propre profil, et la raison est mesurée.
#
# `opt-level = 3` optimise pour la vitesse : sur un interpréteur de VM c'est
# exactement ce qu'on veut, et sur un bundle que chaque visiteur télécharge c'est
# le mauvais arbitrage. `"z"` optimise pour la taille. Les profils ne se
# déclarent qu'à la racine d'un workspace, donc un membre ne peut pas corriger
# ça lui-même : d'où ce profil, et `--profile wasm-release` dans la construction
# du site. Tout le reste est hérité, `panic = "abort"` compris, qui vaut autant
# pour la taille que pour le reste.
[profile.wasm-release]
inherits = "release"
opt-level = "z"

# Une exception, et la même mesure dans l'autre sens : `wisq-vm` entre dans le
# module de la page `linux/`, où il est un interpréteur que chaque image d'écran
# fait tourner. Là, la vitesse est ce qu'on achète, et `"z"` la vendrait pour
# quelques kilo-octets.
[profile.wasm-release.package.wisq-vm]
opt-level = 3
