name: Release

# Builds the agent binaries and the sideloadable IPA, runs the full test suite
# one last time, and publishes a GitHub release with all of it attached.
#
# Two ways in: push a `vX.Y.Z` tag, or run the workflow manually with the
# version as an input. The manual path exists because pushing a tag is not
# always available — some environments only grant branch pushes — and
# `gh release create` creates the tag itself when it is missing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true
        type: string
      dry_run:
        # Everything except the publish. The four agent binaries get built and
        # run, the IPA gets packaged, the test gates run — and no release is
        # created and no tag is pushed. It exists because the rest of this file
        # only ever executed during a release: a mistake in it was discovered
        # by cutting one, which is the worst moment to discover anything.
        description: "Build and check every asset without publishing a release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  test:
    name: Tests Swift (gate)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain, et le cœur qu'elle construit
        # The Rust interpreter is the package's default, so the library has to
        # exist before `swift build` — the manifest stops with instructions
        # otherwise. A release must never be cut against the fallback core by
        # accident, which is exactly why the manifest refuses to guess.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev curl ca-certificates
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
          cargo build --release -p wisq-vm
      - run: swift build
      - run: swift test

  test-rust:
    name: Tests Rust (gate)
    # The release ships Rust binaries, so a Swift-only gate would let a broken
    # daemon through.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --release

  agent-linux:
    name: wisq-agent (${{ matrix.asset }})
    needs: test-rust
    runs-on: ubuntu-latest
    strategy:
      # One architecture failing should not hide whether the other builds.
      fail-fast: false
      matrix:
        include:
          - asset: linux-x86_64
            target: x86_64-unknown-linux-musl
            packages: musl-tools
            # The runner is x86_64, so what it just built runs here.
            emulator: ""
          - asset: linux-aarch64
            target: aarch64-unknown-linux-musl
            # ring is the agent's one C dependency, so a cross build needs a C
            # compiler targeting aarch64 *and* headers to go with it.
            # gcc-aarch64-linux-gnu on its own reaches for the host's
            # /usr/include and dies on bits/libc-header-start.h — the headers
            # are the half that is easy to forget.
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user-static
            emulator: /usr/bin/qemu-aarch64-static
    env:
      # Read only by the aarch64 build; harmless to the x86_64 one, which is
      # why they sit here rather than in a conditional step. rust-lld does the
      # linking because no aarch64 musl linker is packaged for Ubuntu, and the
      # gnu cross-gcc supplies the C compilation ring asks for.
      CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v7
      - name: Build release binary
        # musl, so the result is one static file that runs on any Linux with
        # nothing installed first — including Alpine. It is also why the daemon
        # left Swift: statically linked against the Swift runtime it was 58 MB
        # to serve four routes; with TLS on board this is ~1.7 MB on x86_64 and
        # ~1.4 MB on aarch64.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }} -p wisq-agent
          mkdir -p dist
          cp target/${{ matrix.target }}/release/wisq-agent dist/
          file dist/wisq-agent
          env -i ${{ matrix.emulator }} dist/wisq-agent --help > /dev/null
          tar -C dist -czf wisq-agent-${{ env.VERSION }}-${{ matrix.asset }}.tar.gz wisq-agent
      - uses: actions/upload-artifact@v7
        with:
          name: agent-${{ matrix.asset }}
          path: wisq-agent-*.tar.gz

  agent-macos:
    name: wisq-agent (${{ matrix.asset }})
    needs: test-rust
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: macos-arm64
            target: aarch64-apple-darwin
            # The runner is Apple silicon, so this slice can be run before it
            # is shipped.
            native: true
          - asset: macos-x86_64
            target: x86_64-apple-darwin
            # It cannot. GitHub's macOS runners are arm64 and carry no Rosetta,
            # so this slice is checked for *being* x86_64 rather than for
            # working — `file`, not `--help`. Said plainly here because the
            # other three assets do get run, and an asymmetry nobody wrote down
            # reads later as an oversight.
            native: false
    steps:
      - uses: actions/checkout@v7
      - name: Build release binary
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }} -p wisq-agent
          mkdir -p dist
          cp target/${{ matrix.target }}/release/wisq-agent dist/
          file dist/wisq-agent
          if [ "${{ matrix.native }}" = "true" ]; then
            dist/wisq-agent --help > /dev/null
          else
            file dist/wisq-agent | grep -q x86_64
          fi
          tar -C dist -czf wisq-agent-${{ env.VERSION }}-${{ matrix.asset }}.tar.gz wisq-agent
      - uses: actions/upload-artifact@v7
        with:
          name: agent-${{ matrix.asset }}
          path: wisq-agent-*.tar.gz

  ios-ipa:
    name: wisq (unsigned IPA)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Package the VM core as an XCFramework
        # The shipped app runs the Rust interpreter, so the IPA cannot be built
        # without this. It is also the step that decides which core the release
        # actually carries: build it and the app links Rust, and if it were
        # missing the manifest would stop rather than quietly fall back.
        run: scripts/build-xcframework.sh
      - name: Build unsigned device app
        run: |
          scripts/build-app-icon.sh
          xcodegen generate
          xcodebuild build \
            -project Wisq.xcodeproj \
            -scheme Wisq \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        # An unsigned .ipa is just Payload/<app> zipped; AltStore, Sideloadly
        # and friends re-sign it with the user's own Apple ID at install time.
        run: |
          mkdir Payload
          cp -R .build/ios/Build/Products/Release-iphoneos/Wisq.app Payload/
          zip -qry wisq-${{ env.VERSION }}-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: wisq-*-unsigned.ipa

  publish:
    name: Publish release
    needs: [test, agent-linux, agent-macos, ios-ipa]
    runs-on: ubuntu-latest
    # On a tag push `inputs.dry_run` does not exist, so this reads as true and
    # the release is published — the tag path is unchanged. Only an explicit
    # dry run stops here, with every asset already built and attached to the
    # workflow run rather than to a release.
    if: ${{ !inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.VERSION }}" \
            --title "wisq ${{ env.VERSION }}" \
            --notes "See CHANGELOG.md for details." \
            wisq-agent-*.tar.gz wisq-*-unsigned.ipa
