name: Release

# Builds the agent binaries and the sideloadable IPA, runs the full test suite
# one last time, and publishes a GitHub release with all of it attached.
#
# Two ways in: push a `vX.Y.Z` tag, or run the workflow manually with the
# version as an input. The manual path exists because pushing a tag is not
# always available — some environments only grant branch pushes — and
# `gh release create` creates the tag itself when it is missing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  test:
    name: Tests Swift (gate)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
      - run: swift build
      - run: swift test

  test-rust:
    name: Tests Rust (gate)
    # The release ships Rust binaries, so a Swift-only gate would let a broken
    # daemon through.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --release

  agent-linux:
    name: wisq-agent (Linux x86_64)
    needs: test-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build release binary
        # musl, so the result is one static file that runs on any Linux with
        # nothing installed first — including Alpine. The crate has no C
        # dependencies, which is what makes that free. It is also why the daemon
        # left Swift: statically linked against the Swift runtime it was 58 MB
        # to serve four routes, and this is under 600 KB.
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl -p wisq-agent
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/wisq-agent dist/
          env -i dist/wisq-agent --help > /dev/null
          tar -C dist -czf wisq-agent-${{ env.VERSION }}-linux-x86_64.tar.gz wisq-agent
      - uses: actions/upload-artifact@v7
        with:
          name: agent-linux
          path: wisq-agent-*.tar.gz

  agent-macos:
    name: wisq-agent (macOS arm64)
    needs: test-rust
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build release binary
        run: |
          cargo build --release -p wisq-agent
          mkdir -p dist
          cp target/release/wisq-agent dist/
          dist/wisq-agent --help > /dev/null
          tar -C dist -czf wisq-agent-${{ env.VERSION }}-macos-arm64.tar.gz wisq-agent
      - uses: actions/upload-artifact@v7
        with:
          name: agent-macos
          path: wisq-agent-*.tar.gz

  ios-ipa:
    name: wisq (unsigned IPA)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned device app
        run: |
          xcodegen generate
          xcodebuild build \
            -project Wisq.xcodeproj \
            -scheme Wisq \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        # An unsigned .ipa is just Payload/<app> zipped; AltStore, Sideloadly
        # and friends re-sign it with the user's own Apple ID at install time.
        run: |
          mkdir Payload
          cp -R .build/ios/Build/Products/Release-iphoneos/Wisq.app Payload/
          zip -qry wisq-${{ env.VERSION }}-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: wisq-*-unsigned.ipa

  publish:
    name: Publish release
    needs: [test, agent-linux, agent-macos, ios-ipa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.VERSION }}" \
            --title "wisq ${{ env.VERSION }}" \
            --notes "See CHANGELOG.md for details." \
            wisq-agent-*.tar.gz wisq-*-unsigned.ipa
