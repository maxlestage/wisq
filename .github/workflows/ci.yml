name: CI

# `pull_request` already covers branch work; without limiting `push` to the
# default branch every PR commit would run the whole suite twice.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  rust:
    name: Rust (agent + cœur VM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          rustup component add rustfmt clippy
          rustup target add x86_64-unknown-linux-musl
          rustc --version
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (strict)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --release
      - name: Build the agent, statically
        # musl rather than glibc, so the result runs on any Linux including
        # Alpine with nothing to install first. musl-tools is for ring: TLS
        # brought the agent its one C dependency, and ring's build wants a
        # musl-targeting C compiler.
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools
          cargo build --release --target x86_64-unknown-linux-musl -p wisq-agent
          ls -l target/x86_64-unknown-linux-musl/release/wisq-agent
          env -i target/x86_64-unknown-linux-musl/release/wisq-agent --help > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: agent-linux-ci
          path: target/x86_64-unknown-linux-musl/release/wisq-agent

  core:
    name: Cœur (Linux)
    runs-on: ubuntu-latest
    # The cross-language protocol tests run the real daemon, so they need the
    # binary the Rust job just built and verified.
    needs: rust
    # WisqCore, WisqNet and WisqRemote are Foundation-only, with the platform
    # frameworks behind `canImport` guards. Building them here gives real signal
    # on the protocol work without waiting on a macOS runner.
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
      - name: Fetch Linux test kernel (best effort)
        # The swift image ships without curl or unzip; install them first. Any
        # failure here leaves the image absent and the boot test skips loudly.
        run: |
          (apt-get update && apt-get install -y --no-install-recommends curl unzip ca-certificates) || true
          mkdir -p /tmp/wisq-test-linux-image
          curl -sSL --max-time 120 -o /tmp/kernel.zip \
            https://github.com/cnlohr/mini-rv32ima-images/raw/master/images/linux-6.1.14-rv32nommu-cnl-1.zip \
            && unzip -o /tmp/kernel.zip -d /tmp/wisq-test-linux-image || true
      - uses: actions/download-artifact@v8
        with:
          name: agent-linux-ci
          path: /tmp/wisq-agent-bin
      - name: Make the agent runnable
        run: chmod +x /tmp/wisq-agent-bin/wisq-agent
      - name: Build (mode langage Swift 6)
        run: swift build
      - name: Test
        run: swift test
        env:
          WISQ_LINUX_IMAGE: /tmp/wisq-test-linux-image/Image
          # Without this the cross-language tests skip loudly instead of
          # checking the daemon and the app's client against each other.
          WISQ_AGENT_BINARY: /tmp/wisq-agent-bin/wisq-agent
      - name: Benchmark (boot to prompt)
        # Not a threshold — a shared runner cannot hold one without flaking.
        # It boots a real kernel in the release configuration and prints the
        # throughput, so a regression is visible in the log, and a guest that
        # stops reaching its prompt fails the job outright.
        run: |
          if [ ! -f /tmp/wisq-test-linux-image/Image ]; then
            echo "image Linux absente : banc ignoré"
            exit 0
          fi
          swift run -c release wisq-bench
        env:
          WISQ_LINUX_IMAGE: /tmp/wisq-test-linux-image/Image
      - name: Rust toolchain (pour le test différentiel)
        # Installed here rather than shipping the library from the `rust` job:
        # a static archive built against another image's glibc is a link error
        # waiting for a base-image bump, and this is the one job that has to
        # hold both toolchains at once.
        #
        # gcc is not optional: rustc drives `cc` to link, and the Swift image
        # ships clang under its own name only.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
      - name: Les deux cœurs, comparés sur le même noyau
        # The Rust interpreter is the faster one, so it is the one the app will
        # run — which means nobody exercises the Swift one any more, and a
        # divergence between them stops being noticed. This boots the same
        # kernel through both and compares them instruction count by
        # instruction count, console byte by console byte.
        run: |
          . "$HOME/.cargo/env"
          scripts/test-rust-core.sh
        env:
          WISQ_LINUX_IMAGE: /tmp/wisq-test-linux-image/Image

  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict

  app:
    name: App iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Package the VM core as an XCFramework
        # The Rust switch has been waiting on "work that needs a Mac". CI has
        # one. This builds every Apple slice — device, fat simulator, fat
        # macOS — and checks the result contains what it should rather than
        # trusting that xcodebuild succeeded.
        run: scripts/build-xcframework.sh
      - name: Fetch the Linux test kernel
        # Best effort, like the Linux job: an absent image makes the simulator
        # test skip loudly rather than fail.
        run: |
          mkdir -p /tmp/wisq-test-linux-image
          curl -sSL --max-time 120 -o /tmp/kernel.zip \
            https://github.com/cnlohr/mini-rv32ima-images/raw/master/images/linux-6.1.14-rv32nommu-cnl-1.zip \
            && unzip -o /tmp/kernel.zip -d /tmp/wisq-test-linux-image || true
      - name: Boot a real kernel through the Rust core, inside an iPhone
        # The question the Rust switch actually rests on is not "does it
        # compile for iOS" — every other check answers that — but "does the
        # interpreter run on the device the app ships to". This runs the C ABI
        # conformance program inside a booted simulator and fails if the guest
        # never reaches its Linux banner.
        run: |
          if [ -f /tmp/wisq-test-linux-image/Image ]; then
            scripts/test-ios.sh /tmp/wisq-test-linux-image/Image
          else
            echo "::warning::image de noyau absente, test simulateur ignoré"
          fi
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        # A generic destination avoids pinning a simulator model that the runner
        # image may drop from one release to the next.
        run: |
          xcodebuild build \
            -project Wisq.xcodeproj \
            -scheme Wisq \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned device app
        # The same build the release workflow ships as a sideloadable IPA —
        # validated on every PR so cutting a release cannot surprise us.
        run: |
          xcodebuild build \
            -project Wisq.xcodeproj \
            -scheme Wisq \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
