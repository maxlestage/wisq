name: CI

# `pull_request` already covers branch work; without limiting `push` to the
# default branch every PR commit would run the whole suite twice.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  rust:
    name: Rust (agent + cœur VM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          rustup component add rustfmt clippy
          rustup target add x86_64-unknown-linux-musl
          rustc --version
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (strict)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --release
      - name: Build the agent, statically
        # musl rather than glibc, so the result runs on any Linux including
        # Alpine with nothing to install first. musl-tools is for ring: TLS
        # brought the agent its one C dependency, and ring's build wants a
        # musl-targeting C compiler.
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools
          cargo build --release --target x86_64-unknown-linux-musl -p wisq-agent
          ls -l target/x86_64-unknown-linux-musl/release/wisq-agent
          env -i target/x86_64-unknown-linux-musl/release/wisq-agent --help > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: agent-linux-ci
          path: target/x86_64-unknown-linux-musl/release/wisq-agent

  core:
    name: Cœur (Linux)
    runs-on: ubuntu-latest
    # The cross-language protocol tests run the real daemon, so they need the
    # binary the Rust job just built and verified.
    needs: rust
    # WisqCore, WisqNet and WisqRemote are Foundation-only, with the platform
    # frameworks behind `canImport` guards. Building them here gives real signal
    # on the protocol work without waiting on a macOS runner.
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
      - name: Fetch Linux test kernel (best effort)
        # The swift image ships without curl or unzip; install them first. Any
        # failure here leaves the image absent and the boot test skips loudly.
        run: |
          (apt-get update && apt-get install -y --no-install-recommends curl unzip ca-certificates) || true
          mkdir -p /tmp/wisq-test-linux-image
          curl -sSL --max-time 120 -o /tmp/kernel.zip \
            https://github.com/cnlohr/mini-rv32ima-images/raw/master/images/linux-6.1.14-rv32nommu-cnl-1.zip \
            && unzip -o /tmp/kernel.zip -d /tmp/wisq-test-linux-image || true
      - uses: actions/download-artifact@v8
        with:
          name: agent-linux-ci
          path: /tmp/wisq-agent-bin
      - name: Make the agent runnable
        run: chmod +x /tmp/wisq-agent-bin/wisq-agent
      - name: Rust toolchain, et le cœur qu'elle construit
        # First, not last: the Rust core is the package's default now, so
        # `swift build` below needs libwisq_vm.a to exist or the manifest stops
        # with instructions. Building it here is also what makes every step
        # after this one exercise the interpreter that actually ships.
        #
        # Built here rather than shipped from the `rust` job: a static archive
        # built against another image's glibc is a link error waiting for a
        # base-image bump, and this is the one job that has to hold both
        # toolchains at once.
        #
        # gcc is not optional: rustc drives `cc` to link, and the Swift image
        # ships clang under its own name only. curl and ca-certificates are
        # installed here rather than relied on from the kernel-fetch step above,
        # which is deliberately best-effort — an absent image must skip a test,
        # but an absent curl must not silently become "no toolchain".
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev curl ca-certificates
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
          cargo build --release -p wisq-vm
      - name: Build (mode langage Swift 6)
        run: swift build
      - name: Test
        run: swift test
        env:
          WISQ_LINUX_IMAGE: /tmp/wisq-test-linux-image/Image
          # Without this the cross-language tests skip loudly instead of
          # checking the daemon and the app's client against each other.
          WISQ_AGENT_BINARY: /tmp/wisq-agent-bin/wisq-agent
      - name: Build sans cargo (l'échappatoire WISQ_SWIFT_CORE)
        # The manifest tells anyone without cargo to set this. That sentence is
        # only worth printing if the path it points at is known to work.
        run: WISQ_SWIFT_CORE=1 swift build
      - name: Benchmark (boot to prompt)
        # Not a threshold — a shared runner cannot hold one without flaking.
        # It boots a real kernel in the release configuration and prints the
        # throughput, so a regression is visible in the log, and a guest that
        # stops reaching its prompt fails the job outright.
        run: |
          if [ ! -f /tmp/wisq-test-linux-image/Image ]; then
            echo "image Linux absente : banc ignoré"
            exit 0
          fi
          swift run -c release wisq-bench
        env:
          WISQ_LINUX_IMAGE: /tmp/wisq-test-linux-image/Image
      - name: Les deux cœurs, comparés sur le même noyau
        # The Rust interpreter is the faster one, so it is the one the app will
        # run — which means nobody exercises the Swift one any more, and a
        # divergence between them stops being noticed. This boots the same
        # kernel through both and compares them instruction count by
        # instruction count, console byte by console byte.
        run: |
          . "$HOME/.cargo/env"
          scripts/test-rust-core.sh
        env:
          WISQ_LINUX_IMAGE: /tmp/wisq-test-linux-image/Image

  core-apple:
    name: Cœur (Apple)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # The Linux job builds the same package, so this is not about compiling
      # it twice. It is about the code behind `canImport` guards, which on
      # Linux is not merely untested — it is not there. `JPEGDecoder` wraps
      # ImageIO and reports itself unavailable elsewhere, so on Linux
      # `testDecodesARealJPEG` does not run and
      # `testQualityIsClampedIntoTheSpecRange` returns before asserting
      # anything and reports success. The decoder that turns bytes into pixels
      # was verified by no job at all.
      #
      # The same argument the app job already makes for `WisqUI`: a platform
      # the compiler never sees is a platform the tests never covered.
      - name: Test (mode langage Swift 6)
        # Expect around fifteen skipped, and they are the expected ones rather
        # than a hole: the `WisqAgentTests` and `LinuxBootTests` cases need the
        # agent binary and the Linux test kernel, which this job deliberately
        # does not fetch — the Linux job runs them with both. The odd one out is
        # `testTheShippedEncryptorRefusesWhereThereIsNoRSA`, skipped here
        # precisely *because* there is RSA on Apple; Linux is where it runs.
        #
        # What this job adds over Linux is the other direction:
        # `testDecodesARealJPEG` and its neighbours, which need ImageIO and had
        # never executed in CI before this job existed.
        run: swift test
        env:
          # No Rust core here: this job is for the protocol and platform layers,
          # and the two interpreters are already compared on Linux.
          WISQ_SWIFT_CORE: '1'

  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict
      - name: Check nothing claims a licence
        # No licence has been chosen. This guards the places that state one to
        # other software — the app bundle's copyright string, the Homebrew
        # formula's field, and the `license` field of the Cargo and npm
        # manifests — several of which survived the claim being removed from
        # the site.
        #
        # This step can only ever pass here: it runs against a tree with
        # nothing wrong in it. What holds the guard itself is
        # `site/tests/licence-guard.test.ts`, in the site job, which gives it
        # trees that do claim a licence and checks it refuses each one — and
        # trees that merely name somebody else's, which it must not refuse.
        run: scripts/check-licence-claims.sh
      - name: Check the published architectures match what the installer asks for
        # The release workflow only ever runs when a release is cut, so a gap
        # between what it builds and what scripts/install.sh downloads could
        # not be found by CI at all — only by someone installing on a machine
        # nobody had thought about.
        run: scripts/check-release-matrix.sh

  app:
    name: App iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Package the VM core as an XCFramework
        # The Rust switch has been waiting on "work that needs a Mac". CI has
        # one. This builds every Apple slice — device, fat simulator, fat
        # macOS — and checks the result contains what it should rather than
        # trusting that xcodebuild succeeded.
        run: scripts/build-xcframework.sh
      - name: Fetch the Linux test kernel
        # Best effort, like the Linux job: an absent image makes the simulator
        # test skip loudly rather than fail.
        run: |
          mkdir -p /tmp/wisq-test-linux-image
          curl -sSL --max-time 120 -o /tmp/kernel.zip \
            https://github.com/cnlohr/mini-rv32ima-images/raw/master/images/linux-6.1.14-rv32nommu-cnl-1.zip \
            && unzip -o /tmp/kernel.zip -d /tmp/wisq-test-linux-image || true
      - name: Boot a real kernel through the Rust core, inside an iPhone
        # The question the Rust switch actually rests on is not "does it
        # compile for iOS" — every other check answers that — but "does the
        # interpreter run on the device the app ships to". This runs the C ABI
        # conformance program inside a booted simulator and fails if the guest
        # never reaches its Linux banner.
        #
        # It also prints the throughput, which is the only performance figure
        # this repository takes from the Apple toolchain: `wisq-bench` on the
        # Linux job measures a Linux build. No threshold — a shared runner
        # cannot hold one, and a simulator has no thermal ceiling — but a change
        # that halves it shows in the log.
        run: |
          if [ -f /tmp/wisq-test-linux-image/Image ]; then
            scripts/test-ios.sh /tmp/wisq-test-linux-image/Image
          else
            echo "::warning::image de noyau absente, test simulateur ignoré"
          fi
      - name: Generate project
        run: |
          scripts/build-app-icon.sh
          xcodegen generate
      - name: Run the app layer's tests in a simulated iPhone
        # `WisqUI` is `#if os(iOS)`, so the Linux job never compiles it — which
        # is how two defects in the suspend/resume wiring reached a pull
        # request: a stop that saved the machine it had just ended, and a
        # machine backgrounded and never picked back up. Neither was visible to
        # a compiler, and both are one assertion each here.
        #
        # This drives the real view model against the real interpreter, on its
        # real thread, writing real files. The guest is four bytes of `nop`:
        # booting Linux is covered elsewhere, and what is under test is the
        # wiring around the machine, not the machine.
        run: scripts/test-app.sh
      - name: Build for simulator
        # A generic destination avoids pinning a simulator model that the runner
        # image may drop from one release to the next.
        run: |
          xcodebuild build \
            -project Wisq.xcodeproj \
            -scheme Wisq \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build for simulator on the Swift core
        # The builds either side of this one are now the Rust core — it is the
        # default, and the XCFramework built above is what they link. This one
        # checks the way back still exists: the Swift interpreter is the
        # fallback the manifest points people at when they have no cargo, and a
        # fallback nothing compiles is a fallback that has already rotted.
        #
        # A separate derived data path because the package graph was already
        # resolved without the flag by the step above, and Xcode would happily
        # reuse it.
        env:
          WISQ_SWIFT_CORE: "1"
        run: |
          xcodebuild build \
            -project Wisq.xcodeproj \
            -scheme Wisq \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived-swift-core" \
            CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned device app
        # The same build the release workflow ships as a sideloadable IPA —
        # validated on every PR so cutting a release cannot surprise us.
        run: |
          xcodebuild build \
            -project Wisq.xcodeproj \
            -scheme Wisq \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
