name: CI

# `pull_request` already covers branch work; without limiting `push` to the
# default branch every PR commit would run the whole suite twice.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  core:
    name: Cœur (Linux)
    runs-on: ubuntu-latest
    # WisqCore, WisqNet and WisqRemote are Foundation-only, with the platform
    # frameworks behind `canImport` guards. Building them here gives real signal
    # on the protocol work without waiting on a macOS runner.
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Linux test kernel (best effort)
        # The swift image ships without curl or unzip; install them first. Any
        # failure here leaves the image absent and the boot test skips loudly.
        run: |
          (apt-get update && apt-get install -y --no-install-recommends curl unzip ca-certificates) || true
          mkdir -p /tmp/wisq-test-linux-image
          curl -sSL --max-time 120 -o /tmp/kernel.zip \
            https://github.com/cnlohr/mini-rv32ima-images/raw/master/images/linux-6.1.14-rv32nommu-cnl-1.zip \
            && unzip -o /tmp/kernel.zip -d /tmp/wisq-test-linux-image || true
      - name: Build (concurrence stricte)
        run: swift build -Xswiftc -strict-concurrency=complete
      - name: Test
        run: swift test
        env:
          WISQ_LINUX_IMAGE: /tmp/wisq-test-linux-image/Image

  app:
    name: App iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        # A generic destination avoids pinning a simulator model that the runner
        # image may drop from one release to the next.
        run: |
          xcodebuild build \
            -project Wisq.xcodeproj \
            -scheme Wisq \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
