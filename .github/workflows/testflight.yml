name: TestFlight

# Envoie l'application du jour sur TestFlight, d'où elle s'installe sur un
# iPhone sans câble, sans Mac, et sans expirer au bout de sept jours comme le
# fait une signature de compte personnel.
#
# C'est la seule voie de ce dépôt qui produit une application **signée** : la
# release publie une IPA non signée, que l'utilisateur re-signe lui-même avec
# AltStore ou Sideloadly. Les deux existent pour deux publics — celui qui a un
# compte développeur payant, et celui qui n'en a pas.
#
# Ce que le compte doit avoir, une fois pour toutes :
#   * une clé App Store Connect (App Store Connect → Utilisateurs et accès →
#     Intégrations → Clés) dont l'identifiant, l'émetteur et le contenu `.p8`
#     sont `ASC_KEY_ID`, `ASC_ISSUER_ID` et `ASC_KEY_P8` ;
#   * **facultativement**, un certificat de distribution exporté en `.p12`,
#     encodé en base64 dans `APPLE_CERT_P12`, avec son mot de passe dans
#     `APPLE_CERT_PASSWORD`. Sans lui, `-allowProvisioningUpdates` en demande
#     un neuf à chaque exécution — ce qui a marché vingt-sept fois puis buté
#     sur « Your account has reached the maximum number of certificates ».
#     Avec lui, un seul certificat sert toutes les exécutions et le compte
#     n'en accumule plus. **Facultatif et non exigé** : l'envoi n° 30 a été
#     refusé en quatre secondes pour avoir confondu les deux, et un refus ne
#     révoque aucun certificat. L'étape « Ce que la clé sait » compte ceux du
#     compte à chaque envoi, pour que le plafond se voie avant d'y buter ;
#   * une fiche d'application créée dans App Store Connect portant le
#     `PRODUCT_BUNDLE_IDENTIFIER` du projet. L'upload ne la crée pas : sans
#     elle il échoue en disant que l'application est introuvable.
#
# `ASC_TEAM_ID` (dix caractères, sur developer.apple.com → Membership) n'est
# pas nécessaire : l'étape « Ce que la clé sait » le demande à l'API, où il
# s'appelle `seedId` et se lit sur n'importe quel identifiant d'application.
# Le secret existe quand même comme échappatoire — s'il est renseigné, il
# gagne. Le premier envoi a échoué exactement là, sur le pari que Xcode
# déduirait l'équipe de la clé tout seul : « Signing for "Wisq" requires a
# development team ». Il ne la déduit pas.
#
# Le numéro de build est celui de l'exécution du workflow. TestFlight refuse
# un numéro déjà vu pour une même version, et un compteur qui recule est la
# façon la plus courante de se faire refuser un envoi.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version affichée dans TestFlight (défaut : celle de project.yml)"
        required: false
        type: string

concurrency:
  # Deux envois simultanés se disputeraient le même numéro de build.
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Construire, signer, envoyer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refuser tôt plutôt que dans xcodebuild
        id: secrets
        # Un secret absent se voit ici, en une ligne, plutôt que dans une
        # erreur de signature quinze minutes plus tard.
        #
        # **Cette étape porte un `id:` parce qu'elle est le seul endroit qui a
        # le droit de regarder un secret.** Le contexte `secrets` existe dans
        # un `env:`, pas dans un `if:` — GitHub refuse le workflow entier au
        # lancement si on essaie, et ne le dit qu'à ce moment-là. Ce qui
        # conditionne l'étape du trousseau est donc une **sortie** d'ici, qui
        # ne dit que oui ou non.
        env:
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          missing=""
          [ -n "$ISSUER" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "secrets manquants :$missing" >&2
            echo "voir l'en-tête de .github/workflows/testflight.yml" >&2
            exit 1
          fi
          # L'équipe n'est pas un secret à fournir : l'étape suivante la
          # demande à l'API. Le secret ne sert que d'échappatoire.
          if [ -z "$TEAM_ID" ]; then
            echo "ASC_TEAM_ID absent : l'équipe sera lue sur l'API." >> "$GITHUB_STEP_SUMMARY"
          fi
          # **Le certificat est facultatif, et ce n'est pas de la tolérance.**
          # L'envoi n° 30 a refusé ici, en quatre secondes, parce que cette
          # étape exigeait le certificat que le dépôt venait de rendre
          # obligatoire — et que le compte ne le portait pas. Le workflow
          # s'était donné un mur à lui-même, devant le seul mur réel : le
          # quota de certificats d'Apple, qui a arrêté les envois 28 et 29.
          #
          # Sans le secret, on retombe sur le chemin des vingt-sept premiers
          # envois : Xcode demande un certificat à chaque exécution, ce qui
          # marche tant que le compte n'est pas au plafond. Avec le secret, un
          # seul certificat sert toutes les exécutions et le plafond ne bouge
          # plus. Exiger n'ouvrait ni l'un ni l'autre.
          if [ -z "$CERT_P12" ]; then
            {
              echo "APPLE_CERT_P12 absent : Xcode demandera un certificat à cet envoi."
              echo "APPLE_CERT_PASSWORD absent avec lui — voir l'en-tête du workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "certificat=non" >> "$GITHUB_OUTPUT"
          elif [ -z "$CERT_PASSWORD" ]; then
            # Une moitié de configuration ne se découvre pas à l'import, dix
            # minutes plus tard : elle se dit ici.
            echo "APPLE_CERT_P12 est là, APPLE_CERT_PASSWORD non" >&2
            exit 1
          else
            echo "certificat=oui" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2

      - name: Ce que la clé sait — l'équipe, l'identifiant, la fiche
        id: asc
        # L'équipe que `xcodebuild` réclame ne se déduit pas de la clé : elle
        # se demande à l'API. Au passage, l'identifiant d'application est créé
        # s'il manque, et l'absence de fiche est dite ici plutôt que découverte
        # après dix minutes de construction. L'étape vient avant XcodeGen et
        # le cœur Rust exprès : quand elle refuse, l'exécution a coûté treize
        # secondes (mesuré sur l'exécution n° 3), et on peut la relancer pour
        # sonder la fiche sans regret.
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          WISQ_BUNDLE_ID: app.wisq.ios
        run: bun site/scripts/asc.ts

      - name: Install XcodeGen
        # **Une version, pas « la dernière ».** Les fichiers qu'`xcodegen`
        # écrit sont commités, et le pas « Generate project » compare ce qui
        # vient d'être engendré à ce que le dépôt porte. Cette comparaison ne
        # veut rien dire si les deux côtés lancent des XcodeGen différents.
        #
        # C'est arrivé le jour même où la comparaison a tourné pour la
        # première fois : `brew install xcodegen` a posé 2.46.0 sur le runner,
        # les fichiers commités avaient été engendrés en 2.43.0, et l'en-tête
        # du projet différait — `objectVersion` 54 contre 77,
        # `compatibilityVersion` retirée, `productRefGroup` ajoutée, les deux
        # cibles de test dans l'autre ordre. Aucune spec n'avait bougé. Une
        # garde qui rougit sur la date de la dernière mise à jour de Homebrew
        # est une garde qu'on apprend à ignorer.
        #
        # La version vit dans `.xcodegen-version`, un seul endroit, et
        # l'installateur la pose depuis la release publiée — un binaire
        # universel, donc pas de compilation.
        run: scripts/install-xcodegen.sh

      - name: Package the VM core as an XCFramework
        # L'application embarque l'interpréteur Rust ; sans cette étape le
        # manifeste s'arrête plutôt que de choisir un cœur à notre place.
        run: scripts/build-xcframework.sh

      - name: La clé App Store Connect, sur le disque
        # xcodebuild lit la clé dans un fichier ; il n'a pas d'entrée standard
        # pour elle. Le fichier vit dans le runner, jeté avec lui.
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_$KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_$KEY_ID.p8"

      - name: Le certificat de distribution, dans un trousseau jetable
        if: steps.secrets.outputs.certificat == 'oui'
        # **Ce que l'envoi n° 28 a appris.** Le dessin d'avant laissait
        # `-allowProvisioningUpdates` fabriquer le profil **et** le certificat,
        # et le commentaire d'à côté s'en félicitait : « c'est ce qui évite
        # d'avoir à transporter un certificat dans un secret ». Vingt-sept
        # envois ont marché. Le vingt-huitième a buté sur
        # « Your account has reached the maximum number of certificates » —
        # chaque exécution partait d'un trousseau vide et en demandait un
        # nouveau, jusqu'au plafond d'Apple.
        #
        # Le certificat vient donc d'un secret, et il n'y en a plus qu'un pour
        # toutes les exécutions. **Le profil, lui, continue d'être fabriqué par
        # la clé API** : c'est la moitié qui ne coûtait rien.
        #
        # Le trousseau vit sous `RUNNER_TEMP`, jeté avec le runner, et rien de
        # tout ceci ne touche l'arbre du dépôt — `check-signing-secrets.sh` le
        # tient, et l'a d'abord manqué : sa première version cherchait le nom
        # du secret alors que le `run:` ne connaît que son alias.
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          # Le mot de passe du trousseau lui-même n'est pas un secret : il ne
          # protège rien qui survive à l'exécution.
          security create-keychain -p runner "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p runner "$keychain"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Sans cette ligne, `codesign` demanderait une autorisation à chaque
          # signature et attendrait une réponse que personne ne donnera.
          security set-key-partition-list -S apple-tool:,apple: -s -k runner "$keychain" > /dev/null
          # Le trousseau par défaut, sinon `xcodebuild` ne le regarde pas.
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"
          # Ce qu'on a vraiment importé, sans rien révéler : le nombre et le
          # nom commun. Zéro identité ici serait un échec silencieux à la
          # signature, quinze minutes plus tard.
          found=$(security find-identity -v -p codesigning "$keychain" | grep -c 'Apple Distribution' || true)
          echo "identités de distribution dans le trousseau : $found" >> "$GITHUB_STEP_SUMMARY"
          if [ "$found" -eq 0 ]; then
            echo "aucune identité « Apple Distribution » dans APPLE_CERT_P12" >&2
            echo "un certificat de développement ne signe pas une archive App Store" >&2
            exit 1
          fi

      - name: Archive signée
        env:
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          TEAM_ID: ${{ secrets.ASC_TEAM_ID || steps.asc.outputs.team-id }}
          MARKETING: ${{ inputs.version }}
        run: |
          scripts/build-app-icon.sh
          xcodegen generate
          # **Ce que la CI vient de fabriquer doit être ce que le dépôt porte.**
          #
          # `Wisq.xcodeproj/project.pbxproj` et `App/Info.plist` sont écrits par
          # `xcodegen generate` **et** commités : sans eux, un dépôt fraîchement
          # cloné n'a pas de projet à ouvrir, et XcodeGen n'est pas dans Xcode.
          # Le prix de ce choix est la dérive — quelqu'un modifie `project.yml`,
          # ne régénère pas, et le projet ouvert dans Xcode n'est plus celui que
          # la spec décrit.
          #
          # La CE régénère de toute façon avant de construire. La garde ne coûte
          # donc qu'une comparaison : ce qui vient d'être écrit doit être
          # identique à ce qui est commité.
          #
          # **Un rouge ici veut dire une seule chose** : ce qui est commité
          # n'est pas ce que la spec décrit. La version de XcodeGen est
          # épinglée dans `.xcodegen-version` et posée par
          # `scripts/install-xcodegen.sh`, donc elle ne peut plus dériver
          # toute seule — soit `project.yml` a changé sans que les fichiers
          # engendrés suivent, soit le numéro épinglé a changé sans qu'on
          # régénère. Dans les deux cas la correction est la même : lancer
          # `xcodegen generate` et committer le résultat avec le changement.
          if ! git diff --exit-code -- Wisq.xcodeproj/project.pbxproj App/Info.plist; then
            echo "::error::les fichiers engendrés par xcodegen ne sont pas ceux du dépôt."
            echo "::error::lancer « xcodegen generate » et committer le résultat."
            exit 1
          fi
          # `-allowProvisioningUpdates` avec la clé API enregistre l'identifiant
          # d'application et fabrique le **profil** s'ils manquent. Il fabrique
          # aussi le **certificat** — et c'est ce qui a fini par saturer le
          # compte. Quand `APPLE_CERT_P12` est là, l'étape précédente a posé un
          # trousseau et Xcode s'en contente ; quand il n'y est pas, cette
          # ligne redemande un certificat, comme aux vingt-sept premiers envois.
          xcodebuild archive \
            -project Wisq.xcodeproj \
            -scheme Wisq \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Wisq.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ${TEAM_ID:+DEVELOPMENT_TEAM=$TEAM_ID} \
            ${MARKETING:+MARKETING_VERSION=$MARKETING}

      - name: Export et envoi
        env:
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          TEAM_ID: ${{ secrets.ASC_TEAM_ID || steps.asc.outputs.team-id }}
        run: |
          # `destination: upload` fait l'envoi à la fin de l'export : une étape
          # de moins, et surtout un seul endroit où la clé est présentée.
          # `manageAppVersionAndBuildNumber` à false, sinon Xcode réécrit le
          # numéro de build que l'étape précédente vient de fixer.
          # Une clé `teamID` vide serait pire que pas de clé du tout : Xcode
          # chercherait une équipe nommée par la chaîne vide.
          team_entry=""
          [ -n "$TEAM_ID" ] && team_entry="  <key>teamID</key><string>$TEAM_ID</string>"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
          $team_entry
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          cat "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Wisq.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"

      - name: Ce que le compte porte en certificats — en dernier, pour être lu
        # **La place compte autant que le chiffre.** L'étape « Ce que la clé
        # sait » l'imprime à la treizième seconde, et `xcodebuild` verse
        # ensuite des dizaines de milliers de lignes par-dessus ; l'API des
        # journaux ne sert que la **fin** d'un job. Un diagnostic enterré est
        # un diagnostic qui n'existe pas — le dépôt l'avait déjà appris avec
        # l'étape « Ce que l'iPhone simulé a mesuré ».
        #
        # `always()`, parce que c'est précisément quand l'archive échoue sur
        # « maximum number of certificates » que ce nombre sert.
        if: always()
        env:
          CERTIFICATS: ${{ steps.asc.outputs.certificates }}
        run: |
          echo "${CERTIFICATS:-certificats sur le compte : non relevés}"

      - name: Ce qui a été envoyé
        run: |
          echo "build ${{ github.run_number }} depuis ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Le traitement par Apple prend quelques minutes ; l'installation se fait ensuite depuis TestFlight sur l'iPhone." >> "$GITHUB_STEP_SUMMARY"
