name: Site

# Builds the landing page on every change to it, and publishes it to GitHub
# Pages from master. Pages must be enabled once in the repository settings
# (Settings → Pages → Source: GitHub Actions) and the repository has to be
# public, or on a plan that allows Pages for private repositories.
# No path filter, and that is deliberate. `site/tests/claims.test.ts` guards
# numbers the site advertises about the *repository* — the test count, the
# number of blocking CI gates — by reading the repository and failing when a
# figure stops being true. Filtered to `site/**`, it never ran when the thing
# it guards changed: adding a Swift test could not trip it, and the advertised
# count drifted from 462 to 723 without a single red job. A guard that only
# runs when its subject did not change is not a guard.
#
# The cost of dropping the filter is a bun install, a build and a test run —
# under a minute — on changes that do not touch the site.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: site
        run: bun run typecheck
      - name: Build
        working-directory: site
        run: bun run build
      - name: Test
        working-directory: site
        run: bun test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy to Pages
    # Only from master: a pull request builds and tests, it does not publish.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
