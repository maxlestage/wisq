name: Site

# Builds the landing page on every change to it, and checks it. It no longer
# publishes: the site is served by Heroku, which builds and deploys it itself
# from `master` through its GitHub integration (`Procfile`, `package.json` and
# `scripts/heroku-build.sh` at the repository root). Publishing from here would
# be a second deployer racing the first.
#
# What is left is a guard, and it is the reason this job stays even though it
# ships nothing: it typechecks, builds and tests the site, and `bun test` is
# where `site/tests/claims.test.ts` runs.
#
# No path filter, and that is deliberate. `site/tests/claims.test.ts` guards
# numbers the site advertises about the *repository* — the test count, the
# number of blocking CI gates — by reading the repository and failing when a
# figure stops being true. Filtered to `site/**`, it never ran when the thing
# it guards changed: adding a Swift test could not trip it, and the advertised
# count drifted from 462 to 723 without a single red job. A guard that only
# runs when its subject did not change is not a guard.
#
# The cost of dropping the filter is a bun install, a build and a test run —
# under a minute — on changes that do not touch the site.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: site
        run: bun run typecheck
      - name: Build
        working-directory: site
        run: bun run build
      - name: Test
        working-directory: site
        run: bun test
      # The build Heroku will run, exercised on the same commit. It is a
      # different entry point from the one above — the root `package.json` and
      # the Bun it installs itself — and nothing else here would notice if it
      # broke. A deployment nobody can debug from a phone is one worth checking
      # before it is attempted.
      #
      # Run twice, because the two ways it can be configured are different code
      # paths and the deployment uses the first one. Without `SITE_URL` the
      # build stamps the sentinel the server rewrites per request; with it, the
      # address is pinned and no sentinel is left. A single run would have
      # covered whichever one was not being used in production.
      - name: Heroku build path (address resolved per request)
        run: npm run heroku-postbuild
      - name: Heroku build path (address pinned)
        env:
          SITE_URL: https://wisq.example/
        run: npm run heroku-postbuild
