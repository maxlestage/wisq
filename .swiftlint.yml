# Deliberately lean: the gate exists to catch real defects and drift, not to
# argue about style the codebase already keeps consistent.
included:
  - Sources
  - Tests
  - App

disabled_rules:
  - todo
  - line_length                # comment-heavy protocol code reads better unwrapped
  - identifier_name            # rs1, pc, ir… are the RISC-V and RFB spec names
  - function_body_length       # the CPU interpreter is one long switch by design
  - cyclomatic_complexity      # same
  - type_body_length
  - file_length
  - large_tuple                # (width, height, pixels) snapshots are deliberate
  - trailing_comma
  - for_where
  - multiple_closures_with_trailing_closure
  - nesting

opt_in_rules:
  - empty_count
  - contains_over_first_not_nil
  - redundant_nil_coalescing

force_cast: error
force_try: error
