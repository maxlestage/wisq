[package]
name = "wisq-agent"
version = "0.2.0"
edition = "2021"
authors = ["Max Lestage"]
rust-version = "1.82"
license = "Apache-2.0"
description = "Host daemon that lets wisq on iPhone power VMs on and find their consoles"
repository = "https://github.com/maxlestage/wisq"

# No dependencies. This is a daemon people install on a NAS or a laptop with a
# one-line curl; every crate in it is something they have to trust, and the
# protocol is small enough that a hand-written HTTP/1.1 server and JSON writer
# are less code than the glue a framework would need.
[dependencies]

[[bin]]
name = "wisq-agent"
path = "src/main.rs"
