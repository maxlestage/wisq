[package]
name = "wisq-site"
version = "0.4.0"
edition = "2021"
authors = ["Maxime Nathan Lestage"]
# Active est en édition 2024, qui demande 1.85. C'est déclaré ici plutôt qu'au
# workspace : le cœur de la VM et le démon n'ont aucune raison de monter leur
# plancher parce que le site a un framework.
rust-version = "1.85"
description = "Le front du site de wisq, écrit avec Active : pages rendues à la construction, îlots hydratés et mouvement en WebAssembly, et un Linux qui démarre dans le navigateur"
repository = "https://github.com/maxlestage/wisq"

# Trois cibles pour un seul arbre de composants.
#
#   `ssr`     — la construction rend les vingt-deux pages en HTML : `Node::render`
#               d'Active écrit directement dans une `String`, sans moteur
#               asynchrone ni marqueur hors des îlots.
#   `hydrate` — le navigateur reprend les îlots de cet HTML (`active::hydrate`),
#               et le module anime le reste : le mouvement est en Rust.
#   `linux`   — le même module, plus la machine rv32ima de `wisq-vm` et le
#               terminal qui la conduit. Construit à part et chargé par la seule
#               page `linux/` : un lecteur de la FAQ ne télécharge pas un
#               interpréteur.
#
# `clippy --all-targets --all-features` de la CI les active **ensemble**, sur une
# cible native : le code client est écrit pour compiler des deux côtés.
[features]
default = ["ssr"]
ssr = []
hydrate = ["active/client", "dep:wasm-bindgen", "dep:web-sys", "dep:js-sys"]
linux = ["hydrate", "dep:wisq-vm"]

[dependencies]
# **Active**, la bibliothèque front-end en Rust de Maxime Nathan Lestage —
# https://github.com/maxlestage/Active. Épinglée à un commit : le site est
# reconstruit par Heroku à chaque poussée, et une branche qui bouge ferait
# changer le front sans qu'une ligne de ce dépôt ait changé.
active = { git = "https://github.com/maxlestage/Active", rev = "f7663e45d38628e5cfa66cfe3ede0435abb20e0a" }
wisq-vm = { path = "../wisq-vm", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# `js-sys` pour trois choses que `web-sys` ne nomme pas : `Reflect` (l'événement
# `beforeinstallprompt` n'a pas de liaison, il n'est pas normalisé), `Math`
# (le hasard de la poussière) et `Promise` (le retour du service worker).
js-sys = { version = "0.3", optional = true }
# Chaque fonction de `web-sys` est derrière un drapeau, et seules celles qu'on
# appelle entrent dans le module : la liste est donc celle de ce que le front
# touche réellement, pas une réserve.
web-sys = { version = "0.3", optional = true, features = [
  "AddEventListenerOptions",
  "Blob",
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "HtmlCanvasElement",
  "HtmlCollection",
  "HtmlElement",
  "HtmlInputElement",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "NodeList",
  "Performance",
  "PointerEvent",
  "ScrollBehavior",
  "ScrollToOptions",
  "ServiceWorkerContainer",
  "Storage",
  "Url",
  "WheelEvent",
  "Window",
] }

[lib]
# cdylib pour le lien wasm, rlib pour le binaire de pré-rendu de ce workspace.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "wisq-site-prerender"
path = "src/bin/prerender.rs"
# Sans ça, `--no-default-features --features hydrate` tenterait de construire un
# binaire natif qui n'a aucune raison d'exister.
required-features = ["ssr"]
